<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact archive — OneFactDaily</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><a class="logo" href="index.html">OneFactDaily</a><h1>Fact archive</h1><div id="l"></div><p style="margin-top:40px"><a href="index.html">← Back to home</a></p></div><script src="facts.js"></script><script>loadFacts().then(({list})=>{l.innerHTML=list.reverse().map(f=>'<div class="card"><div class="m">Fact #'+String(f.n).padStart(3,'0')+' · '+f.cat+'</div><h2>'+f.title+'</h2><p>'+f.body+'</p><div class="m" style="text-transform:none">Source: '+f.source+'</div></div>').join('')})</script></body></html>
