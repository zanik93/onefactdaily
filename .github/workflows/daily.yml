name: Schedule daily fact
on:
  schedule:
    # Several attempts overnight (UTC) in case GitHub delays one. The script skips if today's campaign exists.
    - cron: "17 22 * * *"
    - cron: "47 0 * * *"
    - cron: "27 2 * * *"
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python send_fact.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
